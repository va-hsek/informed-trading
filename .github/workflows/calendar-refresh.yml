name: Weekly calendar refresh
on:
  schedule:
    - cron: "0 23 * * 0"       # Sunday 23:00 UTC = Monday 04:30 IST, an hour before the Monday edition
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: informed-trading-commits
  cancel-in-progress: false
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Refresh and verify config/calendar.yaml (events are dated from today forward)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m news.calendar_refresh
      - name: Save the calendar
        run: |
          git config user.name "informed-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/calendar.yaml
          git diff --cached --quiet || git commit -m "Weekly calendar refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
