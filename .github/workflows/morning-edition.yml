name: Morning Edition
on:
  schedule:
    - cron: "0 0 * * *"        # 00:00 UTC = 05:30 IST, every day. GitHub may start it up to ~15 minutes late.
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: informed-trading-commits
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Pre-flight check (model key and network; never fails the run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m news.selftest || true
      - name: Build the news edition (uses the time it runs)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m news.run_news
      - name: Save the edition and its data file
        run: |
          git config user.name "informed-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/*.html
          git add -f data/news/latest.json data/news/latest_prev.json data/news/source_health.json data/news/diagnostics.json data/news/selftest.json || true
          git add config/calendar.yaml || true
          git diff --cached --quiet || git commit -m "Morning Edition $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Make the phone PDF
        id: pdf
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python -m news.pdf
      - name: Send the PDF to your phone (never fails the run)
        if: steps.pdf.outcome == 'success'
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
        run: python -m news.deliver
      - uses: actions/upload-artifact@v4
        with:
          name: morning-edition
          path: |
            reports/news_*.html
            reports/news_*.pdf
          retention-days: 30
