# Which tradable instruments a news topic touches. This is a RELATION table, not advice:
# `relation` states a factual link (what the company/contract is exposed to) and never a direction.
# Tickers are written from general knowledge, BUT every `symbols` entry is checked against Alice Blue's contract master each run (exact match).
# A symbol that does not resolve is shown as 'not found in Alice Blue' instead of being trusted. Nothing for you to check by hand.
# `row` names a dashboard row (config/dashboard.yaml label) whose latest price/change is shown beside the news.
max_headlines_per_instrument: 2
topics:
  crude:
  - name: MCX Crude Oil Mini
    venue: MCX
    row: MCX crude mini (INR/bbl)
    relation: Futures priced off crude; moves with Brent/WTI and the rupee
  - name: ONGC
    venue: NSE
    relation: 'Upstream producer: realisations follow crude prices'
    symbols:
    - ONGC
