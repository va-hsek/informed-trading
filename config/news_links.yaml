    row: MCX gold ten (INR/10 g)
    relation: Futures priced off international gold and the rupee
  - name: Gold ETFs (e.g. GOLDBEES)
    venue: NSE
    relation: Exchange-traded funds that track domestic gold prices; check the fund's tracking error
