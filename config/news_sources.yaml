sectors:
  "Banks and finance":     ["bank", "banks", "banking", "lender", "lenders", "nbfc", "loan", "loans", "credit", "insurer", "insurers", "insurance", "fintech", "mutual fund", "hdfc", "icici", "sbi", "bajaj finance"]
  "IT and software":       ["it services", "software", "saas", "cloud", "cybersecurity", "infosys", "tcs", "wipro", "hcl", "accenture", "salesforce", "microsoft", "oracle"]
  "Chips and AI hardware": ["semiconductor", "semiconductors", "chip", "chips", "chipmaker", "tsmc", "nvidia", "gpu", "data centre", "data center", "memory chip", "ai infrastructure", "coreweave"]
  "Pharma and healthcare": ["pharma", "pharmaceutical", "drugmaker", "drug", "fda", "biotech", "hospital", "hospitals", "vaccine", "healthcare", "medicine", "clinical trial"]
  "Autos and EVs":         ["auto", "automaker", "carmaker", "car sales", "electric vehicle", "electric vehicles", "ev", "tesla", "maruti", "two-wheeler", "tractor", "tyre", "tyres"]
  "Energy and power":      ["renewable", "renewables", "solar", "wind power", "power demand", "electricity", "utility", "utilities", "coal", "nuclear", "power grid", "refiner", "refining", "green hydrogen"]
  "Metals and mining":     ["steel", "aluminium", "aluminum", "copper", "zinc", "iron ore", "mining", "miner", "miners", "lithium", "nickel", "rare earth", "rare earths"]
  "Consumer and retail":   ["fmcg", "retail", "retailer", "retailers", "consumer", "consumers", "restaurant", "restaurants", "apparel", "e-commerce", "ecommerce", "jewellery", "quick commerce"]
  "Real estate and infrastructure": ["real estate", "housing", "property", "realty", "infrastructure", "construction", "cement", "railway", "railways", "highway", "mortgage"]
  "Telecom and media":     ["telecom", "5g", "spectrum", "broadband", "streaming", "media", "airtel", "jio", "vodafone", "netflix", "disney"]
  "Defence and aerospace": ["defence", "defense", "aerospace", "aircraft", "boeing", "airbus", "missile", "missiles", "drone", "drones", "fighter jet"]
  "Aviation, shipping and logistics": ["airline", "airlines", "aviation", "shipping", "tanker", "tankers", "ports", "freight", "logistics", "indigo", "container"]
