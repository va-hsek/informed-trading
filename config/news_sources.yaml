limits:
  max_items_per_feed: 30
  max_age_hours: 60               # items older than this are ignored
  max_articles_read: 260          # hard cap on LLM-read articles per run (controls cost)
  max_article_chars: 12000        # text sent to the model per article
  min_article_chars: 600          # shorter text counts as paywalled / truncated
  max_claims_per_article: 8        # enough to tell most of a story; each claim is still verified against the article
  max_paragraph_claims: 3         # claims per printed paragraph
  front_page_stories: 10
  max_stories_per_section: 14        # default cap; see section_caps for the regions you care most about
  calendar_horizon_days: 21
  calendar_review_max_age_days: 7
  in_brief_max: 150                # headlines listed without a summary
  # Per-section printed-story caps: India, USA and Europe get most room; the rest show only the most important/trending.
  section_caps: {"India": 40, "USA and Americas": 40, "Europe": 40, "Markets and macro": 25, "Energy and metals": 20, "Tech and AI": 16,
                 "Deals and corporate": 16, "Asia-Pacific": 10, "Middle East": 10, "Official releases": 12}
  # Per-region cap on articles READ by the model (rest are listed in brief). Keeps cost bounded and balanced.
  read_caps: {"india": 90, "americas": 90, "europe": 70, "apac": 20, "middleeast": 20, "other": 40}
  trending_bonus_per_extra_source: 1.5

llm:
  extract_model: claude-haiku-5-5      # model strings from Anthropic's published list
  # Estimated list prices in USD per million tokens, used ONLY for the cost log. Sources disagree;
  # these are deliberately the higher figures. Check Anthropic's pricing page and edit.
  price_input_per_mtok: 1.0
  price_output_per_mtok: 5.0

# Topic keywords (case-insensitive, whole-word). The first matching topic group decides the section.
topics:
  crude:      ["crude", "oil price", "brent", "wti", "opec", "barrel", "refinery", "petroleum", "oil output", "oil demand"]
  natgas:     ["natural gas", "lng", "henry hub", "gas storage", "natgas"]
  gold:       ["gold", "bullion", "safe haven", "safe-haven"]
  silver:     ["silver"]
  rates_fed:  ["fed", "fomc", "federal reserve", "treasury yield", "interest rate", "rate cut", "rate hike", "powell", "inflation", "cpi", "payrolls"]
  usd_inr:    ["dollar", "rupee", "inr", "forex", "currency"]
  india:      ["rbi", "repo rate", "sensex", "nifty", "sebi", "gst", "fii", "fpi", "india"]
  geopolitics: ["sanction", "tariff", "war", "ceasefire", "middle east", "russia", "ukraine", "iran", "china", "trade deal"]
  tech:       ["ai", "chip", "semiconductor", "startup", "data center", "data centre", "nvidia"]
  deals:      ["acquire", "acquires", "acquisition", "takeover", "buyout", "merger", "stake", "ipo", "deal valued"]
  defence:    ["defence", "defense", "missile", "navy", "military", "weapons"]

# Region keywords. A feed's own `region` wins; otherwise the first matching region below is used.
regions:
  india:      ["india", "indian", "rbi", "sensex", "nifty", "rupee", "mumbai", "new delhi", "sebi", "bse", "nse", "adani", "reliance", "infosys", "tata"]
  apac:       ["japan", "nikkei", "tokyo", "china", "chinese", "beijing", "shanghai", "hong kong", "hang seng", "korea", "kospi", "seoul", "taiwan", "tsmc", "australia", "rba", "asx", "singapore", "indonesia", "asia"]
  europe:     ["europe", "european", "ecb", "eurozone", "euro zone", "germany", "german", "dax", "france", "britain", "u.k.", "uk", "bank of england", "london", "ftse", "brussels", "eu", "ukraine"]
  middleeast: ["iran", "iranian", "israel", "gaza", "hormuz", "saudi", "gulf", "qatar", "opec", "middle east", "tehran"]
  americas:   ["wall street", "u.s.", "s&p 500", "nasdaq", "dow jones", "federal reserve", "washington", "canada", "canadian", "brazil", "mexico", "treasury", "congress", "white house"]

# Weekly calendar refresh (news/calendar_refresh.py). The news report also triggers it when the calendar is older than
# calendar_review_max_age_days. search_tool_type is Anthropic's server-side web search tool version: check
# https://docs.claude.com for the current string if the call is rejected. Prices are estimates for the cost log only.
calendar_refresh:
  model: claude-sonnet-5-5
  search_tool_type: web_search_20250305
  price_input_per_mtok: 3.0
  price_output_per_mtok: 15.0
