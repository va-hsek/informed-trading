# News sources and topic keywords. Edit freely.
#
# mode: rss    = direct feed; the article page is fetched (robots.txt respected) and, if it is paywalled,
#                the Wayback Machine is tried. archive.today has no API and blocks bots, so for paywalled
#                items the report only prints a manual archive link for you to tap.
# mode: gnews  = Google News RSS search. Gives headline + link only (the article text is not readable
#                this way), so those items are listed as "headline only, not read".
# status: verified = checked valid on 2026-11-07. to_verify = URL believed correct, not checked from
#                here. `python3 -m news.verify_feeds` tests all of them on your machine.
# A feed that fails on a given run is listed in the report's coverage section. It never stops the run.

feeds:
