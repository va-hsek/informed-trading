limits:
  max_items_per_feed: 90
  edition_anchor_ist: "05:30"      # the window runs from this time yesterday to now; at a 05:30 run that is exactly 24 hours
  window_hours: 24
  newsletter_reads: 120            # extra articles read from newsletters, on top of max_articles_read
  max_articles_read: 780          # hard cap on LLM-read articles per run (controls cost)
  max_article_chars: 12000        # text sent to the model per article
  min_article_chars: 150          # short pieces are kept; only pages with a paywall/CAPTCHA marker or under 150 characters go to the archive fallbacks
  max_claims_per_article: 8        # enough to tell most of a story; each claim is still verified against the article
  max_paragraph_claims: 3         # claims per printed paragraph
  front_page_stories: 30
  max_stories_per_section: 42        # default cap; see section_caps for the regions you care most about
  calendar_horizon_days: 21
  calendar_review_max_age_days: 7
  in_brief_max: 450                # headlines listed without a summary (collapsed in the page)
  cluster_cap_per_section: 8        # storylines shown per region or sector; the rest sit behind a "more" fold
  # Per-section printed-story caps: India, USA and Europe get most room; the rest show only the most important/trending.
  section_caps: {"India": 120, "USA and Americas": 120, "Europe": 120, "Markets and macro": 75, "Energy and metals": 60, "Tech and AI": 48,
                 "Deals and corporate": 48, "Asia-Pacific": 30, "Middle East": 30, "Official releases": 36, "Sectors": 240}
  sector_story_cap: 24            # per sector inside the Sectors section
  # Per-region cap on articles READ by the model (rest are listed in brief). Keeps cost bounded and balanced.
  read_caps: {"india": 270, "americas": 270, "europe": 210, "apac": 60, "middleeast": 60, "other": 120}
  trending_bonus_per_extra_source: 1.5
  parallel_workers: 8              # articles are read in parallel so a run takes minutes, not an hour
  max_cost_usd_per_run: 2.5        # hard stop (about Rs 225): reading ends and the rest are listed as headlines if the running estimate passes this
  top_min_outlets: 3               # 'Today in X': a storyline qualifies when this many outlets carry it
  top_floor: 3                     # ...but there are always at least this many
  top_max: 15                      # ...and never more than this
  headline_search:                 # last resort for unreadable/blocked/headline-only items: find the same story on a readable page
    enabled: true
    free_search: true                # Google News RSS search for the same story at another outlet (no quota); tried first
    free_search_max_per_run: 600
    max_per_run: 150
    model: claude-haiku-5-5
    tool_type: web_search_20250305  # check Anthropic's docs for the current version string if rejected

llm:
  provider: auto                      # auto: keys starting sk-ant- are Anthropic, anything else is Gemini. Or force: gemini | anthropic
  extract_model: claude-haiku-5-5      # model strings from Anthropic's published list
  # List prices in USD per million tokens, used for the cost estimate and the spending stop. Check Anthropic's pricing page and edit.
  price_input_per_mtok: 0.10       # Claude Haiku 5.5, prompts up to 100k tokens (platform.claude.com pricing page, checked 9 Nov 2026)
  price_output_per_mtok: 0.50
  # Used instead when the key is a Google (Gemini) key. Prices: ai.google.dev model pages, checked 10 Nov 2026; edit if they change.
  usd_inr: 90                      # rupees per US dollar, only used to show the cost in rupees; edit when the rate moves a lot
  requests_per_minute: 30          # all workers together; the pacer waits instead of letting the API answer 429
  gemini:
    extract_model: gemini-3.5-flash-lite      # stable; default thinking level is minimal
    price_input_per_mtok: 0.30
    price_output_per_mtok: 2.50               # thinking tokens are billed as output and are counted
    calendar_model: gemini-3.6-flash          # weekly job: a stronger model for the calendar
    calendar_price_input_per_mtok: 1.50
    calendar_price_output_per_mtok: 7.50
    price_per_search: 0.014                   # Gemini 3+: first 5,000 searches a month free, then $14 per 1,000; counted at the full price here

# Topic keywords (case-insensitive, whole-word). The first matching topic group decides the section.
topics:
  crude:      ["crude", "oil price", "brent", "wti", "opec", "barrel", "refinery", "petroleum", "oil output", "oil demand"]
